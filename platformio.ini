; PlatformIO project for Solar-Router-F1ATB
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -Wno-missing-field-initializers
    -Isrc
lib_deps =
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
    networking-for-arduino/EthernetESP32@^1.0.2
    milesburton/DallasTemperature@^4.0.6
    lovyan03/LovyanGFX@^1.2.28
    plageoj/UrlEncode@^1.0.1
; Le projet embarque sa propre copie modifiee de OneWire.cpp/.h dans src/ :
; on ignore la lib OneWire installee automatiquement comme dependance de
; DallasTemperature pour eviter les symboles dupliques a l'edition de liens.
lib_ignore =
    OneWire

; Carte actuellement en main : ESP32-C3 SuperMini
; Sert uniquement a valider la compilation (pas d'ecran, pas de PSRAM,
; un seul coeur) en attendant la carte S3 cible.
[env:esp32c3_supermini]
board = nologo_esp32c3_super_mini

; Carte cible finale : ESP32-S3 N16R8 (16MB flash, 8MB PSRAM octal)
[env:esp32s3_n16r8]
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions_s3_16mb.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM

; ESP32 classique (Wroom), cible d'origine du projet F1ATB - gardé pour un routeur existant
; sur cette carte (pas de PSRAM, EMAC/Ethernet WT32-ETH01 disponible via CONFIG_ETH_USE_ESP32_EMAC)
[env:esp32dev]
board = esp32dev
